# End-to-end environment: two echo servers from the same image, reached from the host on 127.0.0.1.
# Started and stopped by tests/e2e/__init__.robot; see the documentation there.
name: testserver-echo-e2e

x-echo-server: &echo-server
  image: testserver_echo:e2e
  build:
    context: ../..
    dockerfile: Dockerfile
  # The fixture keys are readable by their owner only, so run as the host user that owns them.
  user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
  volumes:
    - ../fixtures:/certs:ro
  init: true

services:
  echo:
    <<: *echo-server
    command:
      - --port=50445
      - --cert=/certs/server.pem
      - --key=/certs/server.key
      - --policy=policies/tls13_pqc.txt
      - --idle-timeout=3
    ports:
      - "127.0.0.1:50445:50445"

  echo-mtls:
    <<: *echo-server
    command:
      - --port=50446
      - --cert=/certs/server.pem
      - --key=/certs/server.key
      - --policy=policies/tls13_pqc.txt
      - --client-ca=/certs/ca.pem
    ports:
      - "127.0.0.1:50446:50446"
